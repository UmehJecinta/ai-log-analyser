version: '3.8'

services:

  db:
    image: postgres:16
    container_name: ai-log-analyser-db
    environment:
      POSTGRES_DB: ailoganalyser
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d ailoganalyser"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-log-analyser-ai-service
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-log-analyser-backend
    environment:
      DATABASE_URL: postgresql://dbadmin:${DB_PASSWORD}@db:5432/ailoganalyser
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-log-analyser-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: