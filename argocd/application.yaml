apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-log-analyser
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/UmehJecinta/ai-log-analyser.git
    targetRevision: master
    path: helm/ai-log-analyser

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true