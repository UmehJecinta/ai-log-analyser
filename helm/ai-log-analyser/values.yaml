# Global settings
global:
  environment: dev
  awsRegion: us-east-1

# Frontend service
frontend:
  image:
    repository: 869254767358.dkr.ecr.us-east-1.amazonaws.com/ai-log-analyser-dev-frontend
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Backend service
backend:
  image:
    repository: 869254767358.dkr.ecr.us-east-1.amazonaws.com/ai-log-analyser-dev-backend
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# AI service
aiService:
  image:
    repository: 869254767358.dkr.ecr.us-east-1.amazonaws.com/ai-log-analyser-dev-ai-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8001
  bedrockModelId: anthropic.claude-3-haiku-20240307-v1:0
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Database settings
database:
  name: ailoganalyser
  username: dbadmin
  password: ""
  host: ""
  port: 5432

# Ingress settings
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

# HPA settings
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpuThreshold: 70