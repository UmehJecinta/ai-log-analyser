name: CI/CD Pipeline

on:
  push:
    branches:
      - master

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 869254767358.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: ai-log-analyser-dev-cluster

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push AI service image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ai-log-analyser-dev-ai-service:$IMAGE_TAG ./ai-service
          docker push $ECR_REGISTRY/ai-log-analyser-dev-ai-service:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ai-log-analyser-dev-ai-service:$IMAGE_TAG $ECR_REGISTRY/ai-log-analyser-dev-ai-service:latest
          docker push $ECR_REGISTRY/ai-log-analyser-dev-ai-service:latest

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ai-log-analyser-dev-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/ai-log-analyser-dev-backend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ai-log-analyser-dev-backend:$IMAGE_TAG $ECR_REGISTRY/ai-log-analyser-dev-backend:latest
          docker push $ECR_REGISTRY/ai-log-analyser-dev-backend:latest

      - name: Build and push frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ai-log-analyser-dev-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/ai-log-analyser-dev-frontend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ai-log-analyser-dev-frontend:$IMAGE_TAG $ECR_REGISTRY/ai-log-analyser-dev-frontend:latest
          docker push $ECR_REGISTRY/ai-log-analyser-dev-frontend:latest

      - name: Update Helm values with new image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|tag:.*ai-service.*|tag: $IMAGE_TAG|g" helm/ai-log-analyser/values.yaml
          sed -i "s|tag:.*backend.*|tag: $IMAGE_TAG|g" helm/ai-log-analyser/values.yaml
          sed -i "s|tag:.*frontend.*|tag: $IMAGE_TAG|g" helm/ai-log-analyser/values.yaml

      - name: Commit and push updated Helm values
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/ai-log-analyser/values.yaml
          git diff --staged --quiet || git commit -m "Update image tags to ${{ github.sha }}"
          git push